[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-cifar10"
version = "0.1.0"
description = "Class-conditional ResNet SN-GAN for CIFAR-10"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pillow>=9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gan_cifar*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
